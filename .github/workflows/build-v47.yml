name: Assemble Lashbound V47 Studio file
on:
  workflow_dispatch:
  push:
    paths:
      - 'builds/.staging/v47_part_*.txt'
      - 'tools/rebuild_v47.py'
      - '.github/workflows/build-v47.yml'
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble and verify Roblox Studio place
        run: python3 tools/rebuild_v47.py
      - name: Attach direct rbxlx file to workflow run
        uses: actions/upload-artifact@v4
        with:
          name: Lashbound_V47_Studio
          path: builds/Lashbound_V47_Boss_Recovery_Whip_Impact.rbxlx
      - name: Commit assembled project to repository
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add builds/Lashbound_V47_Boss_Recovery_Whip_Impact.rbxlx
          if ! git diff --cached --quiet; then
            git commit -m 'build: assemble verified V47 Roblox Studio file'
            git push
          fi
