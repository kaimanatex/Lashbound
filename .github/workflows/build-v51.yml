name: Publish Lashbound V51 with preserved combat fixes
on:
  workflow_dispatch:
  push:
    paths:
      - 'builds/Lashbound_V50_Full_Backlog_Mega_Whip.rbxlx'
      - 'tools/rebuild_v51.py'
      - '.github/workflows/build-v51.yml'
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Merge modern Lua combat with V50 cabin and Mega content
        run: python3 tools/rebuild_v51.py
      - name: Upload direct Studio file
        uses: actions/upload-artifact@v4
        with:
          name: Lashbound_V51_Studio
          path: builds/Lashbound_V51_Preserved_Combat_Mega_Whip.rbxlx
      - name: Commit V51 and upgraded gameplay Lua scripts
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add builds/Lashbound_V51_Preserved_Combat_Mega_Whip.rbxlx src/
          if ! git diff --cached --quiet; then
            git commit -m 'release: publish V51 verified Studio file preserving advanced combat'
            git push
          fi
